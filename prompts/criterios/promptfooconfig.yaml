# Evaluación de la Tarea A (criterios de aceptación) con respuestas grabadas.
# Ejecutar desde esta carpeta:  npx promptfoo@0.118 eval --no-cache -o resultados.json
description: "SismoReporta AQP - Tarea A: criterios de aceptación en Gherkin (JSON)"

prompts:
  - id: file://v1.txt
    label: v1
  - id: file://v2.txt
    label: v2
  - id: file://v3.txt
    label: v3
  - id: file://v3.1.txt
    label: v3.1

providers:
  - id: file://../proveedor_grabado.py
    label: opus-5.5-grabado
    config:
      tarea: criterios

defaultTest:
  assert:
    # A1: la salida es JSON válido (sin texto alrededor ni bloques de código) y cumple el contrato.
    - type: is-json
      value: file://esquema.json
      metric: A1_contrato_json

    # A2: si la historia es válida, hay al menos un escenario de éxito y uno de error o de borde.
    - type: javascript
      metric: A2_exito_y_error
      value: |
        let r;
        try { r = JSON.parse(output); } catch (e) { return false; }
        if (r.invest_ok === false) return true;          // lo revisa A4 en H7 y H8
        const tipos = (r.escenarios || []).map(e => e.tipo);
        return tipos.includes('exito') && (tipos.includes('error') || tipos.includes('borde'));

    # A3: los ESCENARIOS describen comportamiento observable, no la implementación.
    # Solo se revisan los escenarios: las preguntas de H8 pueden nombrar PostgreSQL con razón.
    - type: javascript
      metric: A3_sin_implementacion
      value: |
        let texto;
        try { texto = JSON.stringify(JSON.parse(output).escenarios || []).toLowerCase(); }
        catch (e) { texto = output.toLowerCase(); }
        const prohibidas = [/postgres/, /\bsql\b/, /base de datos/, /\btablas?\b/, /endpoint/,
          /\bapis?\b/, /indexeddb/, /localstorage/, /service worker/, /\bhttps?\b/, /\bjson\b/,
          /\buuid\b/, /framework/, /react/, /django/];
        return !prohibidas.some(p => p.test(texto));

tests: file://casos.yaml
