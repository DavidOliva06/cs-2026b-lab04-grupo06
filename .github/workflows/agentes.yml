# Sistema agéntico del Lab 10: en cada Pull Request se prueban el framework (contrato, política,
# herramientas, aprobación y máquina de estados) y se reproducen todas las trayectorias grabadas con
# ModeloGrabado, sin clave de API. Cada reproducción debe dejar en verde la prueba de su issue.
name: agentes

on:
  pull_request:
  workflow_dispatch:

jobs:
  agentes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # el sandbox se extrae del commit E1 con git archive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install pytest==8.3.3 import-linter==2.1 jsonschema==4.23.0 pyyaml==6.0.2 radon==6.0.1

      - name: Pruebas del agente (contrato, política, herramientas, aprobación y estados)
        run: python -m pytest -q agentes/pruebas_agente

      - name: Reproducir las trayectorias grabadas
        run: python agentes/reproducir.py

      - name: Trazas reproducidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trazas-agentes
          path: agentes/trazas/
